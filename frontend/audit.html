<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VYOMA // KAVACH - Audit &amp; Trace</title>
    <link rel="stylesheet" href="css/industrial.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">VYOMA<span class="accent"> // </span>KAVACH</div>
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="analysis.html">PTW Analysis</a>
            <a href="audit.html">Audit</a>
        </nav>
        <div class="auth-status" id="auth-status"></div>
    </header>

    <main class="wrap">
        <h1 class="page-title">Audit &amp; Trace</h1>
        <p class="page-sub">Persisted KAVACH audit records with hash-chain verification. Trace shows only what the backend recorded.</p>

        <div id="chain-status" class="ex ex-ok"></div>

        <section class="panel">
            <div class="sec-label">Audit Records</div>
            <table class="data">
                <thead>
                    <tr>
                        <th>Audit Ref</th>
                        <th>Permit</th>
                        <th>Timestamp</th>
                        <th>Pipeline</th>
                        <th>Previous Hash</th>
                        <th>Event Hash</th>
                    </tr>
                </thead>
                <tbody id="audit-rows">
                    <tr><td colspan="6"><span class="muted">Loading ...</span></td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/render.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
</body>
</html>
